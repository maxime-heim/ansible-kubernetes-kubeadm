---
- name: Installer les CRDs Prometheus Operator
  become: false
  command: >
    helm upgrade --install prometheus-operator-crds
    {{ helm_charts_dir }}/prometheus-operator-crds-{{ helm_charts['prometheus-operator-crds'].version }}.tgz
    --namespace kube-system
    --wait
  environment:
    KUBECONFIG: /home/debian/.kube/config
