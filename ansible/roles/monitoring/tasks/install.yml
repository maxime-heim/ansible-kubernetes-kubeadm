---
- name: Créer le namespace monitoring
  kubernetes.core.k8s:
    name: "monitoring"
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: /home/debian/.kube/config

- name: Installer Prometheus & Grafana
  become: false
  command: helm upgrade --install kube-prometheus-stack {{ helm_charts_dir }}/kube-prometheus-stack-{{ helm_charts['kube-prometheus-stack'].version }}.tgz --namespace monitoring 
  environment:
    KUBECONFIG: /home/debian/.kube/config

- name: Attendre que Prometheus soit prêt
  become: false
  command: kubectl rollout status deployment/kube-prometheus-stack-grafana -n monitoring --timeout=300s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false
